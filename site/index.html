<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>株価予想ボード</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js" defer></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <h1>株価予想ボード</h1>
      <p class="muted">最終更新: <span data-testid="updated-at">—</span></p>
    </div>
    <div class="reanalyze-box">
      <a data-testid="reanalyze" class="button" href="https://github.com/tennis226243-coder/test/actions/workflows/daily.yml" target="_blank" rel="noopener">今すぐ再分析</a>
      <p class="muted small">実行後2〜3分で更新されます。終わったらこのページを再読み込みしてください</p>
    </div>
  </header>

  <main>
    <div data-testid="notice" class="notice" hidden></div>
    <div data-testid="error" class="error" hidden></div>

    <section>
      <h2>世界動向</h2>
      <div id="world" class="cards"></div>
    </section>

    <section>
      <h2>世界の指標</h2>
      <div id="indicators" class="indicators"></div>
    </section>

    <section>
      <h2>予測一覧</h2>
      <div class="table-wrap">
        <table class="predictions">
          <thead><tr><th>銘柄</th><th>現在値</th><th>翌日</th><th>1週間</th><th>1か月</th><th>確信度</th></tr></thead>
          <tbody id="assets"></tbody>
        </table>
      </div>
      <div id="detail" data-testid="asset-detail" class="detail" hidden></div>
    </section>

    <section>
      <h2>的中率</h2>
      <div id="accuracy" data-testid="accuracy"></div>
    </section>

    <section>
      <h2>参照した記事</h2>
      <ul id="sources" class="sources"></ul>
    </section>
  </main>

  <footer>
    <p data-testid="disclaimer">投資助言ではありません。投資の判断はご自身の責任で行ってください。</p>
  </footer>
</body>
</html>
